name: shazamzinho-audio-catalog

services:
  valkey:
    image: valkey/valkey:8.1.12-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:${AUDIO_CATALOG_VALKEY_PORT:-6382}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

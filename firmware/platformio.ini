; Shazamzin — firmware ESP32 (ESP-IDF via PlatformIO)
; Ver docs/architecture.md seção 9.1 e docs/esp-idf-notes.md

[platformio]
; o código fica em main/ (convenção ESP-IDF), não em src/
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_LOG_DEFAULT_LEVEL=3

; Shazamzin — firmware ESP32 (ESP-IDF via PlatformIO)
; Ver docs/architecture.md seção 9.1 e docs/esp-idf-notes.md

[platformio]
; o código fica em main/ (convenção ESP-IDF), não em src/
src_dir = main

[env:esp32dev]
; 6.11.0 fixa o ESP-IDF 5.4.1 (o plano usa 5.4). Sem pinar, o PlatformIO pega a
; plataforma mais nova (8.x = ESP-IDF 6.1), onde o componente 'json' (cJSON) e outras APIs mudaram.
platform = espressif32@6.11.0
board = esp32dev
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_LOG_DEFAULT_LEVEL=3
